<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .relative {
        position: relative;
        width: 400px;
        height: 200px;
        border: 3px solid #73ad21;
      }

      .absolute {
        bottom: 0px;
        right: 0;
        width: 200px;
        height: 100px;
        border: 3px solid red;
      }
    </style>
    <title>Position</title>
  </head>
  <body>
    <h2>Position: relative</h2>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit amet</p>

    <div class="relative">
      Este elemento div tem a propriedade `position: relative;`
      <div class="absolute">
        Este elemento div tem a propriedade `position: absolut;`
      </div>
    </div>
  </body>
</html>
