<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
  </head>
  <body>
    <ul>
      <li><a href="./desafio.html">Início</a></li>
    </ul>

    <form action="./thank-you.html">
      <div>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required /><br />
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required /><br />
      </div>

      <div>
        <label>
        <input type="radio" id="masculino" name="gender" value="masculino" />
        <label for="masculino">Masculino</label>
      </div>

      <div>
        <input type="radio" id="feminino" name="gender" value="feminino" />
        <label for="feminino">Feminino</label>
      </div>

      <div>
        <input type="radio" id="outro" name="gender" value="outro" />
        <label for="outro">Outro</label>
      </div>

      <div>
        <label>Quais serviços você está interessado?</label>

        <div>
          <input type="checkbox" id="landing-page" name="landing-page" value="landing-page" />
          <label for="landing-page">Criação de Landing Page</label>
        </div>
        <div>
          <input type="checkbox" id="aplicativo" name="aplicativo" value="aplicativo" />
          <label for="aplicativo">Desenvolvimento de Aplicativo</label>
        </div>
        <div>
          <input type="checkbox" id="formatacao-de-pc" name="formatacao-de-pc" value="formatacao-de-pc" />
          <label for="formatacao-de-pc">Formatação de Computador</label>
        </div>

        <div>
            <label for="mensagem">Mensagem</label>
        </div>

        <div>
            <textarea id="mensagem" name="mensagem" rows="4" cols="50"></textarea>
        </div>

        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </div>
    </form>
  </body>
</html>
